[package]
name = "patina-ui"
version = "0.1.13"
edition = "2024"
license = "BSD-3-Clause"
description = "Patina: the window frame, components and design language shared by Photograph, UnAmp and other egui desktop apps"
repository = "https://github.com/Sector-F-Labs/patina"
keywords = ["egui", "gui", "components", "skin", "desktop"]
categories = ["gui"]

[lib]
name = "patina"

[features]
default = []
# Markdown as Notebook shows it (patina::markdown): the parser, syntax
# highlighting, image loading and Ubuntu's variable fonts.
markdown = ["highlight", "dep:pulldown-cmark", "dep:egui_extras", "dep:image"]
# Syntax highlighting, a line at a time (patina::highlight).
highlight = ["dep:syntect", "dep:two-face"]

[dependencies]
egui = "0.35"
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
egui_extras = { version = "0.35", features = ["file", "image", "gif", "webp"], optional = true }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"], optional = true }
# bat's syntaxes, precompiled: syntect's and TOML, TypeScript, Dockerfile...
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"], optional = true }
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
toml = "1"
zbus = "5"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
eframe = "0.35"
image = { version = "0.25", default-features = false, features = ["png"] }
