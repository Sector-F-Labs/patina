[package]
name = "patina-ui"
version = "0.1.5"
edition = "2024"
license = "BSD-3-Clause"
description = "Patina: the window frame, components and design language shared by Photograph, UnAmp and other egui desktop apps"
repository = "https://github.com/Sector-F-Labs/patina"
keywords = ["egui", "gui", "components", "skin", "desktop"]
categories = ["gui"]

[lib]
name = "patina"

[dependencies]
egui = "0.35"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
toml = "1"
zbus = "5"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
eframe = "0.35"
image = { version = "0.25", default-features = false, features = ["png"] }
