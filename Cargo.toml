[package]
name = "patina-ui"
version = "0.1.17"
edition = "2024"
license = "BSD-3-Clause"
description = "Patina: the window frame, components and design language shared by Photograph, UnAmp and other egui desktop apps"
repository = "https://github.com/Sector-F-Labs/patina"
keywords = ["egui", "gui", "components", "skin", "desktop"]
categories = ["gui"]

[lib]
name = "patina"

[workspace]
# The emoji font, a git-only crate (ADR-0031).
members = ["emoji-font"]

[features]
default = []
# Markdown as Notebook shows it (patina::markdown): the parser, syntax
# highlighting, image loading and Ubuntu's variable fonts.
markdown = ["highlight", "dep:pulldown-cmark", "dep:egui_extras", "dep:image"]
# Syntax highlighting, a line at a time (patina::highlight).
highlight = ["dep:syntect", "dep:two-face"]
# Colour emoji (patina::emoji): emoji painted as images, since egui draws no
# colour glyphs. The font isn't in this crate (10 MB, over crates.io's limit): the
# app depends on patina-emoji-font from git and calls emoji::install (ADR-0031).
emoji = ["dep:ttf-parser", "dep:image"]

[dependencies]
egui = "0.35"
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
egui_extras = { version = "0.35", features = ["file", "image", "gif", "webp", "svg_text"], optional = true }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"], optional = true }
# bat's syntaxes, precompiled: syntect's and TOML, TypeScript, Dockerfile...
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"], optional = true }
ttf-parser = { version = "0.25.1", optional = true }
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
toml = "1"
zbus = "5"
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# The window shadow (src/shadow.rs): the protocol on the toolkit's own connection.
wayland-client = "0.31"
# dlopen, as winit has it: libwayland-client is loaded when the app runs, not needed to build.
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols-plasma = { version = "0.3", default-features = false, features = ["client"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The menu bar on macOS (ADR-0036); not built anywhere else.
muda = { version = "0.21", default-features = false }

[dev-dependencies]
# The font the emoji tests install (no version: it is not published).
patina-emoji-font = { path = "emoji-font" }
eframe = "0.35"
image = { version = "0.25", default-features = false, features = ["png"] }
