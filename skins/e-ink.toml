# E-Ink: high-contrast monochrome, for e-ink and other low-refresh displays.
# Only white and black: no greys, no tints, no shadows. Things are white with a
# black outline, not grey, and the title bar is white, with the shown tab
# ringed in black. Built into Patina, so every Patina app
# offers it. See docs/skinning.md for the format.

format = 1
name = "E-Ink"
author = "Divan"
base = "light"
corner_radius = 0
shadows = false

[colors]
background = "#FFFFFF"    # paper
surface = "#FFFFFF"       # panels, text fields, lists
surface_alt = "#FFFFFF"   # alternate rows
border = "#000000"        # outlines, dividers
text = "#000000"          # primary text
text_strong = "#000000"   # headings, emphasized text
text_weak = "#000000"     # muted text, placeholders
accent = "#000000"        # selection, slider fill, active toggles
accent_text = "#FFFFFF"   # white text on the black accent
link = "#000000"          # links, current item (underlined by egui)
warning = "#000000"       # no colour on e-ink
error = "#000000"

[controls]
background = "#FFFFFF"
hover = "#FFFFFF"
pressed = "#000000"
text = "#000000"
text_hover = "#000000"
track = "#000000"         # slider rail: egui cannot outline it, so it is a black line

[window]
title_bar = "#FFFFFF"
title_text = "#000000"
border = "#000000"
corner_radius = 0

[window.controls]
icon = "#000000"
icon_hover = "#FFFFFF"
hover = "#000000"
pressed = "#000000"
close_hover = "#000000"
close_icon_hover = "#FFFFFF"

# UnAmp's own parts; other apps skip this section.
[app.unamp]
display = "#FFFFFF"
time = "#000000"
title = "#000000"
spectrum = ["#000000", "#000000", "#000000"]
spectrum_peak = "#000000"
