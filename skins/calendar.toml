# Calendar: Calendar's look, matching its icon. A deep red title bar (the
# red of freebsd.org's header) over paper: warm off-white panels, grey ink,
# and the same red for today and the selection. See Patina's docs/skinning.md for the format.

format = 1
name = "Calendar"
author = "Patina"
base = "light"
corner_radius = 6
shadows = true

[colors]
background = "#F7F5F0"    # the page
surface = "#FFFFFF"       # text fields and lists
surface_alt = "#EFECE5"   # days outside the month
border = "#DDD8CE"
text = "#2E2C29"
text_strong = "#161513"
text_weak = "#8F8B84"     # the icon's grey days
accent = "#AB2B28"        # the icon's header, freebsd.org's red
accent_text = "#FFFFFF"
link = "#9A2522"
warning = "#C46A00"
error = "#C01C28"

[controls]
background = "#EFECE5"
hover = "#E6E2D9"
pressed = "#DDD8CE"
text = "#2E2C29"
text_hover = "#161513"

[window]
title_bar = "#AB2B28"
title_text = "#FFFFFF"
border = "#8A2220"
corner_radius = 15

[window.controls]
icon = "#FFFFFF"
icon_hover = "#FFFFFF"
hover = "#BE3B37"
pressed = "#8A2220"
close_hover = "#6E1A18"
close_icon_hover = "#FFFFFF"
