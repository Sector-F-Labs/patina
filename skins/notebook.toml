# Notebook: Notebook's look, matching its icon. A leather-brown title bar
# over cream paper: warm off-white panels, sepia ink, and the same brown for
# the selection. See Patina's docs/skinning.md for the format.

format = 1
name = "Notebook"
author = "Patina"
base = "light"
corner_radius = 6
shadows = true

[colors]
background = "#F6F1E6"    # the page, the icon's cream
surface = "#FCFAF4"       # the note and text fields
surface_alt = "#EEE7D8"
border = "#DED4C1"
text = "#3A2F25"          # sepia ink
text_strong = "#1F1812"
text_weak = "#8F8274"
accent = "#6E4A2E"        # the icon's cover
accent_text = "#FFFFFF"
link = "#8A5A2B"
warning = "#C46A00"
error = "#C01C28"

[controls]
background = "#EEE7D8"
hover = "#E6DDCB"
pressed = "#DED4C1"
text = "#3A2F25"
text_hover = "#1F1812"

[window]
title_bar = "#6E4A2E"
title_text = "#FFFFFF"
border = "#563820"
corner_radius = 15

[window.controls]
icon = "#FFFFFF"
icon_hover = "#FFFFFF"
hover = "#82593A"
pressed = "#563820"
close_hover = "#3F2814"
close_icon_hover = "#FFFFFF"
